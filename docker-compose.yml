version: '3.9'
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bottrader
      POSTGRES_PASSWORD: bottrader
      POSTGRES_DB: bottrading
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - '5555:8000'
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql+asyncpg://bottrader:bottrader@postgres:5432/bottrading
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=http://127.0.0.1:11434

  frontend:
    build:
      context: ./frontend
    container_name: frontend-1
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5555/api/v1
      - INTERNAL_API_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    volumes:
      # Mount mã nguồn từ host; giữ node_modules trong volume Linux để Tailwind/PostCSS
      # luôn cài đúng trong container (tránh UI trắng/chữ đen vì thiếu CSS build).
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"

volumes:
  postgres_data:
  frontend_node_modules:
